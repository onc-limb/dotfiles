# Command gates for TAKT runs in dotfiles. TAKT runs them in the task worktree
# at the end of each step that edits files and sends the step back on failure.
# Reviewers cannot run commands (TAKT drops Bash from steps without edit), so
# workflow checks live here instead of in a reviewer's instructions.
workflow_overrides:
  steps:
    # workflow-maker
    create:
      quality_gates: &workflow_doctor
        - type: command
          name: takt-workflow-doctor
          command: takt workflow doctor takt/common/workflows/*.yaml
        - type: command
          name: takt-wrapper-syntax
          command: bash -n bin/takt
        - type: command
          name: takt-wrapper-tests
          command: bash takt/tests/test_wrapper.sh && TEST_BASH=/bin/bash bash takt/tests/test_wrapper.sh
        - type: command
          name: takt-build-runtime-tests
          command: python3 -m unittest discover -s takt/tests -p 'test_*.py'
    fix:
      quality_gates: *workflow_doctor
