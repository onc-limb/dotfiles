palette = "fallback"

# プロンプト: タブバー・エージェント一覧と同じ「淡い地に同じ色相の濃い文字」の札を並べる
#
#     dotfiles › nvim › lua    main   ●1 +2 ↑1                   ✘ 1   ✦ 1   󱦟 3s 
#   ❯
#
# 色は下の palettes の名前で指定する。WezTerm (wezterm/theme.lua) が今の配色パターンとライト / ダークから
# palettes.wezterm を作り、このファイルに足したものを ~/.local/state/wezterm/starship.toml に書き出して
# STARSHIP_CONFIG で読ませる。配色を切り替えると次のプロンプトから色が変わる。
# WezTerm の外 (VSCode など) ではこのファイルがそのまま読まれ、palettes.fallback の色になる。
#
# 必要なときだけ出す札: git の状態・rebase などの途中・失敗した終了コード・ジョブ・遅いコマンドの時間・SSH 先

format = """
$hostname\
[](fg:path_bg)[ ](bg:path_bg)\
${custom.path_parent}\
${custom.path_leaf}\
[ ](bg:path_bg)[](fg:path_bg) \
$git_branch\
$git_state\
$git_status\
$line_break\
$character"""

right_format = """
$status\
$jobs\
$cmd_duration"""

add_newline = true

# WezTerm の外で使う色 (ANSI の色名)
[palettes.fallback]
path_bg = "bright-black"
path_ink = "white"
path_dim = "white"
branch_bg = "bright-black"
branch_ink = "purple"
chip_bg = "bright-black"
chip_ink = "white"
dim_ink = "white"
ok_ink = "green"
warn_bg = "bright-black"
warn_ink = "yellow"
err_bg = "bright-black"
err_ink = "red"
info_bg = "bright-black"
info_ink = "cyan"
accent = "purple"
err = "red"
vim = "green"

[hostname]
ssh_only = true
format = "[](fg:info_bg)[ 󰒋 $hostname ](fg:info_ink bg:info_bg)[](fg:info_bg) "

# パスの札: 上の階層は薄く、今いる場所 (リポジトリの中ならリポジトリ名から下) は太字。› で区切る。
# 標準の directory は substitutions で / を置き換えるとリポジトリ名の強調が壊れるので、自前で描く
# (リポジトリの中は実体のパス。シンボリックリンク越しでもリポジトリを正しく見分けるため)
# アイコンはリポジトリの中なら 、外なら 󰉋
[custom.path_parent]
when = true
shell = ["bash", "--noprofile", "--norc"]
style = "fg:path_dim bg:path_bg"
format = "[$output]($style)"
command = '''
tilde() { case $1 in "$HOME") echo "~" ;; "$HOME"/*) echo "~${1#"$HOME"}" ;; *) echo "$1" ;; esac; }
if root=$(git rev-parse --show-toplevel 2>/dev/null) && [ -n "$root" ]; then
  icon=""; pre=$(tilde "${root%/*}")
else
  icon="󰉋"; here=$(tilde "$PWD"); pre=${here%/*}
  { [ "$here" = "/" ] || [ "$here" = "~" ]; } && pre=""
fi
# 上の階層は直近の 2 つだけ残す
IFS=/ read -ra parts <<< "${pre#/}"
n=${#parts[@]}
[ "$n" -gt 2 ] && pre="…/${parts[n-2]}/${parts[n-1]}"
pre=${pre#/}
# 出力の末尾の空白は削られるので「 ›」で終え、続きの空白は path_leaf の format が足す
[ -n "$pre" ] && pre=" ${pre//\// › } ›"
printf '%s%s' "$icon" "$pre"
'''

[custom.path_leaf]
when = true
shell = ["bash", "--noprofile", "--norc"]
style = "bold fg:path_ink bg:path_bg"
format = "[ $output]($style)"
command = '''
if root=$(git rev-parse --show-toplevel 2>/dev/null) && [ -n "$root" ]; then
  here=$(pwd -P); leaf="${root##*/}${here#"$root"}"
else
  case $PWD in "$HOME") leaf="~" ;; /) leaf="/" ;; *) leaf=${PWD##*/} ;; esac
fi
[ "$leaf" = "/" ] || leaf=${leaf//\// › }
[ -w . ] || leaf="$leaf 󰌾"
printf '%s' "$leaf"
'''

[git_branch]
symbol = " "
format = "[](fg:branch_bg)[ $symbol$branch(:$remote_branch) ](fg:branch_ink bg:branch_bg)[](fg:branch_bg) "

[git_state]
format = "[](fg:warn_bg)[ $state( $progress_current/$progress_total) ](bold fg:warn_ink bg:warn_bg)[](fg:warn_bg) "

# 状態の札: 地は控えめな色にし、記号ごとに文字の色を変える
#   変更 = 黄 / ステージ済み = 緑 / 未追跡・stash = 薄く / 衝突・削除 = 赤 / 上流との差 = シアン
[git_status]
format = "([](fg:chip_bg)[$all_status$ahead_behind](bg:chip_bg)[ ](bg:chip_bg)[](fg:chip_bg) )"
conflicted = "[ ✖$count](fg:err_ink bg:chip_bg)"
modified = "[ ●$count](fg:warn_ink bg:chip_bg)"
staged = "[ +$count](fg:ok_ink bg:chip_bg)"
renamed = "[ »$count](fg:ok_ink bg:chip_bg)"
deleted = "[ −$count](fg:err_ink bg:chip_bg)"
untracked = "[ ?$count](fg:dim_ink bg:chip_bg)"
stashed = "[ ≡$count](fg:dim_ink bg:chip_bg)"
ahead = "[ ↑$count](fg:info_ink bg:chip_bg)"
behind = "[ ↓$count](fg:info_ink bg:chip_bg)"
diverged = "[ ↑$ahead_count↓$behind_count](fg:info_ink bg:chip_bg)"
up_to_date = ""

[character]
success_symbol = "[❯](bold fg:accent)"
error_symbol = "[❯](bold fg:err)"
vimcmd_symbol = "[❮](bold fg:vim)"

[status]
disabled = false
symbol = "✘ "
format = "[](fg:err_bg)[ $symbol$status ](bold fg:err_ink bg:err_bg)[](fg:err_bg) "

[jobs]
symbol = "✦ "
number_threshold = 1
format = "[](fg:info_bg)[ $symbol$number ](fg:info_ink bg:info_bg)[](fg:info_bg) "

[cmd_duration]
min_time = 2000
format = "[](fg:chip_bg)[ 󱦟 $duration ](fg:chip_ink bg:chip_bg)[](fg:chip_bg)"
