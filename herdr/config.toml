# Herdr (AI エージェント用ターミナルマルチプレクサ) の設定
# https://herdr.dev/docs/configuration/
#
# 使い方: WezTerm のタブ = プロジェクト。各タブで `herdr session attach <プロジェクト名>` を起動し
# (WezTerm の LEADER + n)、その中の左サイドバーにエージェント (Claude Code / Codex) を縦に並べる。
# Herdr のワークスペース 1 つ = エージェント 1 セッション。名前は作業タイトルにする (prefix + Shift + W)。
# 既定値の一覧は `herdr --default-config`、変更後の反映は `herdr server reload-config`。

[theme]
# WezTerm の ANSI パレット (VSCode Light Modern) をそのまま使い、ライト基調で統一する
name = "terminal"

[theme.custom]
# 背景を塗らず WezTerm の透過 (opacity 0.5 + blur) を通す
panel_bg = "reset"
# ASSUMPTION: sidebar_bg も reset を受け付ける前提 (効かなければこの行を削除して panel_bg に追従させる)
sidebar_bg = "reset"
# WezTerm のアクティブタブ / カーソルと同じ青をアクセントに
accent = "#005FB8"
# 選択中の Space / Agent 行: 黒ではなく淡い青のハイライト
active_row_bg = "#D6E7FA"
# Navigate モードのカーソル行 (WezTerm の selection_bg と同じ)
selection_bg = "#ADD6FF"
# 文字・補助色 (WezTerm の foreground / 非アクティブタブに合わせる)
text = "#3B3B3B"
subtext0 = "#616161"
surface0 = "#ECECEC"
surface1 = "#DDDDDD"
overlay0 = "#8C8C8C"
overlay1 = "#666666"

[terminal]
# 新しいペイン / タブ / ワークスペースは Herdr を起動したディレクトリ (= LEADER + n を押した
# プロジェクトのルート) で開く。ペインごとの cwd を引き継ぎたい場合は "follow"
new_cwd = "current"

[keys]
# WezTerm の LEADER (ctrl+q) と衝突しないよう既定の ctrl+b のまま。
# よく使うスペース切り替えは WezTerm 側の Cmd+j / Cmd+k が prefix+j / prefix+k を代わりに送る
prefix = "ctrl+b"
# スペース (ワークスペース = 左の縦タブ) を上下に移動。エージェントの有無に関係なく全スペースを巡る
next_workspace = "prefix+j"
previous_workspace = "prefix+k"
# エージェントが動いている行だけを巡る (空のスペースは飛ばす)
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"
# ペイン移動は j/k をエージェント移動に譲り、矢印キーにする (1 ワークスペース 1 エージェントなので使用頻度は低い)
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
# ワークスペースを番号で直接切り替え (prefix + 1..9 は既定どおりタブ切り替え)
switch_workspace = "prefix+shift+1..9"
# サイドバーの表示切替 (既定値を明示)
toggle_sidebar = "prefix+b"

[ui]
tab_bar_position = "top"
# ワークスペース作成時に名前 (= 作業タイトル) を聞く
prompt_new_workspace_name = true
# エージェントの状態を記号で表示 (🔴 入力待ち / 🟡 作業中 / 🔵 完了・未確認 / 🟢 完了・確認済み)
status_indicators = "symbols"
# 外側のターミナル (WezTerm) に渡すタイトル。WezTerm のタブ名は LEADER + n で固定するため最小限にする
window_title = "{workspace}"

[ui.sidebar.agents]
# 1 行目: 状態アイコン + 作業タイトル (ワークスペース名)
# 2 行目: 状態のテキスト + エージェント名 (claude / codex)
rows = [["state_icon", "workspace"], ["state_text", "agent"]]
row_gap = 1

[experimental]
# macOS: prefix を押した時点で入力ソースを英数に切り替える (日本語入力のまま操作キーを押す事故の対策)
switch_ascii_input_source_in_prefix = true
# 日本語 IME 利用時にエージェントのカーソルが隠れる問題の回避
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
