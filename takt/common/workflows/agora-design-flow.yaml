name: agora-design-flow
description: 設計（比較・ADR）→ 実装 → 設計への適合の検証 → 完了報告を 1 本にし、ADR にない設計判断が要るときは最大 2 回まで設計へ戻るワークフロー。
max_steps: 80
initial_step: design

# Global workflow (dotfiles). install.sh copies it into each TAKT config dir (~/.takt-work, ~/.takt-private, ~/.takt)
# because TAKT does not read workflows through symlinks; edit this file, not
# the copy.
#
# Implements the flow of `agora guide` (design -> ADR -> hand over -> implement
# -> verify -> report) for the delegated mode. Planning, implementation and
# peer review reuse `agora-development-core` (a fork of the builtin
# development-core with a plan review; see that file) through
# `workflow_call`, the same way `agora-default` does. The `agora-design` policy
# is written by the `takt` wrapper (dotfiles bin/takt) into the project's
# .takt/facets/policies/ from `agora knowledge show` before each `takt run` in
# a project that has .takt/agora.conf.
# When TAKT is upgraded, diff the builtin development-core.yaml against
# agora-development-core.yaml and the args below.
#
# How the loop back to design is built (see also takt/common/facets/):
# - `agora-development-core` only returns COMPLETE or ABORT, so "an ADR is missing"
#   cannot be a return value of the call. Both results go to an independent
#   `verify` step (fresh context, reads ADRs + code only), which is the one
#   place that sorts the outcome:
#     conforms  -> report
#     deviation -> same develop step again (code deviates from an ADR: fix it)
#     undecided -> redesign step (an ADR-less design decision is needed)
#     blocked   -> ABORT (failure unrelated to design)
#   The deviation/undecided split is defined in agora-design-flow-verify.md
#   and policies/agora-adr-adherence.md.
# - The limit of 2 redesigns is the shape of the graph, not a counter:
#   design -> develop -> verify, redesign_1 -> develop_r1 -> verify_r1,
#   redesign_2 -> develop_r2 -> verify_r2. `undecided` from verify_r2 is ABORT,
#   and the reason stays in verification.md. TAKT's `when(...)` cannot read
#   step iteration counts and loop_monitors are judged by an LLM, so neither
#   gives a hard limit.
# - The ADRs reach the implementers and reviewers inside `agora-development-core`
#   through `input_reports` on the call (design.md is inherited by the child
#   steps). design.md carries a fixed section of rules for implementers and
#   reviewers (output contract agora-design-flow-design.md). Facet names in
#   `args` are resolved from the child's directory and ~/.takt/facets, so a
#   policy file of this workflow cannot be passed there; the agora-adr policy
#   is used on the steps defined in this file (verify).
# - design, verify and report use the builtin personas planner and supervisor,
#   which takt/common/targets.yaml routes to the judgment models (Opus).
# Facets are referenced by relative path so that the workflow resolves in a
# task worktree and after install.sh copied it into the TAKT config dirs.

policies:
  agora-adr: ../facets/policies/agora-adr-adherence.md
instructions:
  design: ../facets/instructions/agora-design-flow-design.md
  verify: ../facets/instructions/agora-design-flow-verify.md
  report: ../facets/instructions/agora-design-flow-report.md
report_formats:
  design: ../facets/output-contracts/agora-design-flow-design.md
  verification: ../facets/output-contracts/agora-design-flow-verification.md
  summary: ../facets/output-contracts/agora-design-flow-summary.md

steps:
  - name: design
    description: タスク・agora-design・これまでの ADR を読み、2 案以上を比べて推奨案と影響範囲を決め、設計判断ごとに ADR を残す
    capabilities: edit
    edit: true
    persona: planner
    policy: agora-design
    instruction: design
    pass_previous_response: false
    output_contracts:
      report:
        - name: design.md
          format: design
    rules:
      - condition: designed
        next: develop

  - name: develop
    description: 設計レポートの ADR を守るべき設計として渡し、計画・計画の見直し・テスト・実装・ピアレビューを agora-development-core で進める
    kind: workflow_call
    call: ./agora-development-core.yaml
    input_reports:
      - from_step: design
        reports: [design.md]
      - from_step: verify
        reports: [verification.md]
        optional_if_unrun: true
    args: &develop_args
      implementation_pool: coding-facets
      implementation_workflow: development-implement-dynamic
      remediation_workflow: development-remediation-dynamic
      plan_instruction: scenario-based-plan
      plan_report_format: scenario-based-plan
      replan_instruction: scenario-based-replan-implementation
      testing_instruction: scenario-based-write-tests-first
      testing_report_format: scenario-based-test-report
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_verification_replan_instruction: scenario-based-verification-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      reviewer_suite: development-review
      plan_policy:
        - design-planning
        - agora-design
      testing_policy:
        - coding
        - agora-design
      development_policy:
        - coding
        - agora-design
      review_policy_additions:
        - agora-review-scope
      review_policy:
        - coding
        - testing
        - review
        - architecture
        - agora-design
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
      verification_policy:
        - coding
        - testing
        - review
        - architecture
        - agora-design
        - agora-fix-verification-scope
    rules:
      - condition: COMPLETE
        next: verify
      - condition: ABORT
        next: verify

  - name: verify
    description: 実装が ADR と agora-design の確かめることに沿っているかを、実装の経緯を知らない状態で検証し、外れた実装と足りない設計判断を分ける
    capabilities: readonly
    edit: false
    persona: supervisor
    policy:
      - agora-design
      - agora-adr
    instruction: verify
    pass_previous_response: false
    input_reports:
      from_step: design
      reports: [design.md]
    output_contracts:
      report:
        - name: verification.md
          format: verification
    rules:
      - condition: conforms
        next: report
      - condition: deviation
        next: develop
      - condition: undecided
        next: redesign_1
      - condition: blocked
        next: ABORT

  - name: redesign_1
    description: 検証が見つけた「ADR に書かれていない設計判断」を決め、ADR を足すか直す。前の判断を置き換えるときは古い ADR を「置き換え」にする
    capabilities: edit
    edit: true
    persona: planner
    policy: agora-design
    instruction: design
    pass_previous_response: false
    input_reports:
      - from_step: design
        reports: [design.md]
      - from_step: verify
        reports: [verification.md]
    output_contracts:
      report:
        - name: design-r1.md
          format: design
    rules:
      - condition: designed
        next: develop_r1

  - name: develop_r1
    description: 設計レポートの ADR を守るべき設計として渡し、計画・計画の見直し・テスト・実装・ピアレビューを agora-development-core で進める
    kind: workflow_call
    call: ./agora-development-core.yaml
    input_reports:
      - from_step: redesign_1
        reports: [design-r1.md]
      - from_step: verify_r1
        reports: [verification-r1.md]
        optional_if_unrun: true
    args: *develop_args
    rules:
      - condition: COMPLETE
        next: verify_r1
      - condition: ABORT
        next: verify_r1

  - name: verify_r1
    description: 実装が ADR と agora-design の確かめることに沿っているかを、実装の経緯を知らない状態で検証し、外れた実装と足りない設計判断を分ける
    capabilities: readonly
    edit: false
    persona: supervisor
    policy:
      - agora-design
      - agora-adr
    instruction: verify
    pass_previous_response: false
    input_reports:
      from_step: redesign_1
      reports: [design-r1.md]
    output_contracts:
      report:
        - name: verification-r1.md
          format: verification
    rules:
      - condition: conforms
        next: report
      - condition: deviation
        next: develop_r1
      - condition: undecided
        next: redesign_2
      - condition: blocked
        next: ABORT

  - name: redesign_2
    description: 検証が見つけた「ADR に書かれていない設計判断」を決め、ADR を足すか直す。前の判断を置き換えるときは古い ADR を「置き換え」にする
    capabilities: edit
    edit: true
    persona: planner
    policy: agora-design
    instruction: design
    pass_previous_response: false
    input_reports:
      - from_step: redesign_1
        reports: [design-r1.md]
      - from_step: verify_r1
        reports: [verification-r1.md]
    output_contracts:
      report:
        - name: design-r2.md
          format: design
    rules:
      - condition: designed
        next: develop_r2

  - name: develop_r2
    description: 設計レポートの ADR を守るべき設計として渡し、計画・計画の見直し・テスト・実装・ピアレビューを agora-development-core で進める
    kind: workflow_call
    call: ./agora-development-core.yaml
    input_reports:
      - from_step: redesign_2
        reports: [design-r2.md]
      - from_step: verify_r2
        reports: [verification-r2.md]
        optional_if_unrun: true
    args: *develop_args
    rules:
      - condition: COMPLETE
        next: verify_r2
      - condition: ABORT
        next: verify_r2

  - name: verify_r2
    description: 実装が ADR と agora-design の確かめることに沿っているかを、実装の経緯を知らない状態で検証し、外れた実装と足りない設計判断を分ける
    capabilities: readonly
    edit: false
    persona: supervisor
    policy:
      - agora-design
      - agora-adr
    instruction: verify
    pass_previous_response: false
    input_reports:
      from_step: redesign_2
      reports: [design-r2.md]
    output_contracts:
      report:
        - name: verification-r2.md
          format: verification
    rules:
      - condition: conforms
        next: report
      - condition: deviation
        next: develop_r2
      - condition: undecided
        next: ABORT
      - condition: blocked
        next: ABORT

  - name: report
    description: 作った・更新した ADR、再設計の回数と理由、設計に沿っていることの確認結果を、人が確かめられる形で報告する
    capabilities: readonly
    edit: false
    persona: supervisor
    policy: agora-design
    instruction: report
    pass_previous_response: false
    input_reports:
      - from_step: design
        reports: [design.md]
        optional_if_unrun: true
      - from_step: redesign_1
        reports: [design-r1.md]
        optional_if_unrun: true
      - from_step: redesign_2
        reports: [design-r2.md]
        optional_if_unrun: true
      - from_step: verify
        reports: [verification.md]
        optional_if_unrun: true
      - from_step: verify_r1
        reports: [verification-r1.md]
        optional_if_unrun: true
      - from_step: verify_r2
        reports: [verification-r2.md]
        optional_if_unrun: true
    output_contracts:
      report:
        - name: summary.md
          format: summary
    rules:
      - condition: reported
        next: COMPLETE
