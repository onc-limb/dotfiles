# Which role each TAKT step / persona plays. Shared by every environment.
#
# build-runtime.py turns this table plus an environment's profiles.yaml
# (takt/work/, takt/private/) into that environment's runtime.yaml, so the
# split of work between roles is written once: changing who implements here
# changes the work environment (Codex) and the private credit-out assignment
# (OpenCode Go) together.
#
# A value is a role name, or {ladder: [role, ...]} for a TAKT promotion ladder
# (stage 0 first; a step with `promotion: [{at: N}]` moves up a stage on its
# Nth visit).
# Assignment priority in TAKT 0.75: steps > tags > personas > defaults.

# Reviewers, the assistant seat and anything unlisted.
defaults: worker

# TAKT's internal seats (only `selector` and `assistant` exist; a seat takes a
# fixed role, not a ladder). The selector only picks IDs from a list (which
# reviewers to run, which implement / fix variant), one request each: cheapest
# model. The status judgment phase (Phase 3) is not a seat: TAKT 0.75 runs it
# on the step's own model (status-judgment-phase.js), so it cannot be moved.
internal_agents:
  selector: router

personas:
  # plan / replan / fix-plan. `planner` first; `planner-top` only when a step
  # that declares promotion runs again (both Opus for now, see profiles.yaml).
  planner:
    ladder: [planner, planner-top]
  review-adjudicator: judge
  supervisor: judge
  # implement / fix / reimplement / fix-retry / write_tests
  coder: implementer

steps:
  # Plan review (agora-development-core). The reviewer persona is referenced
  # by file path, so it is routed by step name rather than by persona.
  plan-review: judge
  plan-review-2: judge
  # The one re-plan after a plan review sends the plan back: top model.
  plan-revise: planner-top
  # coder-persona step that designs the tests: keep it on the judgment model.
  write_tests: test-designer
  architecture-review: judge
  # final-gate / final-gate-direct are not listed: they run on the supervisor
  # persona's judge. When the initial reviewers all approve, agora-peer-review
  # skips adjudication, and the final gate is then the only judge-model check
  # of the requirements, so it must not be moved to the worker model.
  # Retries after the implementer could not pass.
  reimplement: implementer-retry
  fix-retry: implementer-retry
